<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
        <div class="bg-orange-600 p-8 text-white text-center">
            <h1 class="text-3xl font-black tracking-tighter">MHE FULL SERVICES</h1>
            <p class="text-orange-100 opacity-80 text-sm font-bold uppercase tracking-widest">Presupuestos Profesionales</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Fecha</label>
                    <input type="date" id="fecha" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Presupuesto Nº</label>
                    <input type="text" id="presupuestoNo" placeholder="0001" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Nombre del Cliente</label>
                <input type="text" id="cliente" placeholder="Nombre completo" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Actividad / Rubro</label>
                <select id="actividad" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none bg-white font-semibold text-gray-700">
                    <option value="Electricidad">Electricidad</option>
                    <option value="HVAC (Heating, Ventilation, and Air Conditioning)">HVAC (Heating, Ventilation, and Air Conditioning)</option>
                    <option value="Construcción en seco">Construcción en seco</option>
                </select>
            </div>

            <div class="border-t border-gray-100 pt-6">
                <h3 class="text-gray-800 font-bold mb-4 flex items-center gap-2">
                    <span class="w-2 h-6 bg-orange-500 rounded-full"></span>
                    Tareas a Realizar
                </h3>
                <div id="contenedor-items" class="space-y-3">
                    </div>
            </div>

            <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-gray-700">¿Incluye Materiales?</span>
                    <select id="incMat" onchange="toggleMateriales()" class="bg-white border border-gray-300 p-2 rounded-lg font-bold text-orange-600 outline-none">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="seccionMat" class="hidden mt-4 pt-4 border-t border-gray-200 space-y-3">
                    <textarea id="descMat" placeholder="Describa los materiales incluidos..." class="w-full border-2 border-gray-100 rounded-xl p-3 text-sm resize-none h-20 outline-none focus:border-orange-400" rows="2"></textarea>
                    <input type="number" id="valMat" oninput="calcularTotal()" placeholder="$ Valor de Materiales" class="w-full border-2 border-gray-100 p-3 rounded-xl text-right font-bold text-orange-600 outline-none focus:border-orange-400">
                </div>
            </div>

            <div class="flex justify-between items-end pt-4">
                <div>
                    <p class="text-[10px] font-black text-gray-400 uppercase">Total Estimado</p>
                    <p id="txtTotal" class="text-4xl font-black text-gray-800">$ 0,00</
