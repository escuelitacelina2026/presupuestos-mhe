<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">Presupuestos realizados por MHE</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700">📅 Fecha</label>
                <input type="date" id="fecha" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">🔢 Presupuesto Nº</label>
                <input type="text" id="presupuestoNo" placeholder="Ej: 001" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700">👤 Cliente</label>
                <input type="text" id="cliente" placeholder="Nombre del cliente" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">🛠️ Actividad</label>
                <select id="actividad" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white focus:ring-2 focus:ring-orange-500 outline-none">
                    <option value="Electricidad">Electricidad</option>
                    <option value="Aire Acondicionado">Aire Acondicionado</option>
                    <option value="Durlok">Durlok</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">📝 Tareas a realizar</label>
                <textarea id="tareas" rows="5" placeholder="Describa el trabajo detalladamente..." class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"></textarea>
            </div>
            
            <button onclick="prepararPDF()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-4 rounded-xl font-bold shadow-md transition-all transform active:scale-95">
                📥 GENERAR Y DESCARGAR PDF
            </button>
        </div>
    </div>

    <script>
        function prepararPDF() {
            const img = new Image();
            img.src = 'mhe.png'; 
            
            img.onload = function() {
                generarPDF(img);
            };

            img.onerror = function() {
                console.error("No se pudo cargar mhe.png. Generando sin logo.");
                generarPDF(null);
            };
        }

        function generarPDF(imgData) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const fecha = document.getElementById('fecha').value;
            const num = document.getElementById('presupuestoNo').value;
            const cliente = document.getElementById('cliente').value;
            const actividad = document.getElementById('actividad').value;
            const tareas = document.getElementById('tareas').value;

            // --- DISEÑO DEL PDF ---
            
            // Logo posicionado a la derecha
            // 165 es la coordenada X (cerca del borde derecho que es 210)
            if (imgData) {
                doc.addImage(imgData, 'PNG', 165, 10, 30, 30);
            }

            // Título (centrado un poco más a la izquierda para dejar espacio al logo)
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("PRESUPUESTO DE TRABAJO", 90, 25, { align: 'center' });
            
            doc.setDrawColor(255, 100, 0); 
            doc.setLineWidth(1);
            doc.line(15, 45, 195, 45);

            // Información
            doc.setFontSize(12);
            doc.text(`Fecha:`, 20, 60);
            doc.text(`Presupuesto Nº:`, 20, 70);
            doc.text(`Cliente:`, 20, 80);
            doc.text(`Actividad:`, 20, 90);

            doc.setFont("helvetica", "normal");
            doc.text(fecha || "---", 60, 60);
            doc.text(num || "---", 60, 70);
            doc.text(cliente || "---", 60, 80);
            doc.text(actividad || "---", 60, 90);

            doc.setFont("helvetica", "bold");
            doc.text("TAREAS A REALIZAR:", 20, 105);
            
            doc.setFont("helvetica", "normal");
            const tareasDivididas = doc.splitTextToSize(tareas || "Sin tareas especificadas", 170);
            doc.text(tareasDivididas, 20, 115);

            // --- PIE DE PÁGINA ---
            doc.setFontSize(10);
            doc.setFont("helvetica", "italic");
            doc.setTextColor(100);
            
            doc.text("Presupuesto valido por 10 días.", 105, 275, { align: 'center' });
            doc.text("Garantia del trabajo realizado por 3 meses.", 105, 282, { align: 'center' });

            doc.save(`Presupuesto_MHE_${num || 'sin_numero'}.pdf`);
        }
    </script>
</body>
</html>
