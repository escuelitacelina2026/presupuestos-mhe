<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center mb-6">PRESUPUESTO - MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="fecha" class="border p-2 rounded w-full outline-none">
                <input type="text" id="presupuestoNo" placeholder="Presupuesto Nº" class="border p-2 rounded w-full outline-none">
            </div>

            <input type="text" id="cliente" placeholder="Nombre del Cliente" class="border p-2 rounded w-full outline-none">
            
            <select id="actividad" class="border p-2 rounded w-full outline-none bg-white font-semibold">
                <option value="Electricidad">Electricidad</option>
                <option value="HVAC (Heating Ventilation, and Air Conditioning)">HVAC (Heating Ventilation, and Air Conditioning)</option>
                <option value="Construcción en seco">Construcción en seco</option>
            </select>
            
            <div class="border-t pt-4">
                <p class="font-bold mb-2">Tareas a realizar:</p>
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <textarea id="d1" placeholder="Tarea 1" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea>
                        <input type="number" id="v1" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10">
                    </div>
                    <div class="flex gap-2">
                        <textarea id="d2" placeholder="Tarea 2" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea>
                        <input type="number" id="v2" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10">
                    </div>
                    <div class="flex gap-2">
                        <textarea id="d3" placeholder="Tarea 3" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea>
                        <input type="number" id="v3" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10">
                    </div>
                    <div class="flex gap-2">
                        <textarea id="d4" placeholder="Tarea 4" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea>
                        <input type="number" id="v4" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10">
                    </div>
                    <div class="flex gap-2">
                        <textarea id="d5" placeholder="Tarea 5" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea>
                        <input type="number" id="v5" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10">
                    </div>
                </div>
            </div>

            <div class="bg-orange-50 p-4 rounded border border-orange-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold">¿Incluye Materiales?</label>
                    <select id="incMat" onchange="verMat()" class="border p-1 rounded bg-white font-bold">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="cajaMat" class="hidden space-y-2 pt-2 border-t border-orange-200">
                    <textarea id="descMat" placeholder="Descripción de materiales" class="w-full border p-2 rounded text-sm bg-white outline-none resize-none" rows="2"></textarea>
                    <input type="number" id="valMat" oninput="calcularTotal()" placeholder="$ Valor Materiales" class="w-full border p-2 rounded text-sm text-right bg-white outline-none">
                </div>
            </div>

            <div class="text-right p-4 bg-orange-100 rounded border border-orange-300">
                <span class="font-bold text-gray-700">TOTAL ESTIMADO: </span>
                <span id="txtTotal" class="text-2xl font-bold text-orange-600">$ 0,00</span>
            </div>
            
            <button onclick="prepararPDF()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-orange-700 transition-all transform active:scale-95">
                📥 GENERAR Y DESCARGAR PDF
            </button>
        </div>
    </div>

    <script>
        function verMat() {
            const si = document.getElementById('incMat').value === "SI";
            const caja = document.getElementById('cajaMat');
            if(si) {
                caja.classList.remove('hidden');
            } else {
                caja.classList.add('hidden');
                document.getElementById('valMat').value = "";
                document.getElementById('descMat').value = "";
            }
            calcularTotal();
        }

        function calcularTotal() {
            let t = 0;
            document.querySelectorAll('.item-valor').forEach(i => { t += parseFloat(i.value) || 0; });
            if(document.getElementById('incMat').value === "SI") {
                t += parseFloat(document.getElementById('valMat').value) || 0;
            }
            document.getElementById('txtTotal').innerText = "$ " + t.toLocaleString('es-AR', {minimumFractionDigits: 2});
            return t;
        }

        function prepararPDF() {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = 'mhe.png'; // Asegúrate que el archivo esté en la misma carpeta
            
            img.onload = function() {
                generarDocumento(img);
            };
            img.onerror = function() {
                generarDocumento(null); // Si no hay logo, genera igual el PDF
            };
        }

        function generarDocumento(imgLogo) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Encabezado Naranja
            doc.setFillColor(234, 88, 12);
            doc.rect(0, 0, 210, 40, 'F');

            if(imgLogo) {
                doc.addImage(imgLogo, 'PNG', 10, 5, 30, 30);
            }

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.text("MHE FULL SERVICES", 50, 20);
            doc.setFontSize(12);
            doc.text("Presupuesto de Servicio", 50, 28);

            // Datos del cliente y fecha
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(10);
            const fecha = document.getElementById('fecha').value;
            const presupuestoNo = document.getElementById('presupuestoNo').value;
            doc.text(`Fecha: ${fecha}`, 10, 50);
            doc.text(`Presupuesto Nº: ${presupuestoNo}`, 150, 50);
            doc.text(`Cliente: ${document.getElementById('cliente').value}`, 10, 58);
            doc.text(`Rubro: ${document.getElementById('actividad').value}`, 10, 66);

            doc.setDrawColor(234, 88, 12);
            doc.line(10, 72, 200, 72);

            // Tabla de Tareas
            let y = 82;
            doc.setFont("helvetica", "bold");
            doc.text("DESCRIPCIÓN DE TAREAS", 10, y);
            doc.text("VALOR", 170, y);
            doc.setFont("helvetica", "normal");
            y += 10;

            for(let i=1; i<=5; i++) {
                const d = document.getElementById('d'+i).value;
                const v = document.getElementById('v'+i).value;
                if(d) {
                    doc.text(d, 10, y, {maxWidth: 150});
                    doc.text(`$ ${parseFloat(v || 0).toLocaleString('es-AR')}`, 170, y);
                    y += 10;
                }
            }

            // Materiales
            if(document.getElementById('incMat').value === "SI") {
                y += 5;
                doc.setFont("helvetica", "bold");
                doc.text("MATERIALES INCLUIDOS:", 10, y);
                y += 8;
                doc.setFont("helvetica", "normal");
                doc.text(document.getElementById('descMat').value, 10, y, {maxWidth: 150});
                doc.text(`$ ${parseFloat(document.getElementById('valMat').value || 0).toLocaleString('es-AR')}`, 170, y);
                y += 15;
            }

            // Total
            y += 10;
            doc.setFillColor(245, 245, 245);
            doc.rect(130, y-8, 70, 14, 'F');
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text(`TOTAL: ${document.getElementById('txtTotal').innerText}`, 135, y);

            // --- VALIDEZ DEL PRESUPUESTO ---
            y += 25;
            doc.setFontSize(9);
            doc.setTextColor(100, 100, 100);
            doc.setFont("helvetica", "italic");
            doc.text("Este presupuesto tiene una validez de 10 días a partir de la fecha emitida.", 10, y);
            doc.text("Precios sujetos a cambios según variación de costos de materiales.", 10, y + 5);

            doc.save(`Presupuesto_${document.getElementById('presupuestoNo').value}.pdf`);
        }
    </script>
</body>
</html>
