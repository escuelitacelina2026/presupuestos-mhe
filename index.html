<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10 font-sans">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
        <div class="bg-orange-600 p-8 text-white text-center">
            <h1 class="text-3xl font-black tracking-tighter">MHE FULL SERVICES</h1>
            <p class="text-orange-100 opacity-80 text-sm font-bold uppercase tracking-widest">Panel de Presupuestos</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Fecha de Emisión</label>
                    <input type="date" id="fecha" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Número de Control</label>
                    <input type="text" id="presupuestoNo" placeholder="Nº 0001" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Nombre del Cliente / Empresa</label>
                <input type="text" id="cliente" placeholder="Ej: Juan Pérez" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Tipo de Servicio</label>
                <select id="actividad" class="w-full border-2 border-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none bg-white">
                    <option>Electricidad</option>
                    <option>HVAC (Climatización)</option>
                    <option>Construcción en seco</option>
                    <option>Mantenimiento Industrial</option>
                </select>
            </div>

            <div class="border-t border-gray-100 pt-6">
                <h3 class="text-gray-800 font-bold mb-4 flex items-center gap-2">
                    <span class="w-2 h-6 bg-orange-500 rounded-full"></span>
                    Tareas y Mano de Obra
                </h3>
                <div id="contenedor-items" class="space-y-3">
                    </div>
            </div>

            <div class="bg-orange-50 rounded-2xl p-5 border border-orange-100">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-orange-800">¿Incluye Materiales?</span>
                    <select id="incMat" onchange="toggleMateriales()" class="bg-white border border-orange-200 p-2 rounded-lg font-bold text-orange-600 outline-none">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="seccionMat" class="hidden mt-4 pt-4 border-t border-orange-200 space-y-3">
                    <textarea id="descMat" placeholder="Detalle de materiales..." class="w-full border-none rounded-xl p-3 text-sm resize-none h-20 outline-none" rows="2"></textarea>
                    <input type="number" id="valMat" oninput="calcularTotal()" placeholder="Costo materiales $" class="w-full border-none p-3 rounded-xl text-right font-bold text-orange-600 outline-none">
                </div>
            </div>

            <div class="flex justify-between items-end pt-4">
                <div>
                    <p class="text-[10px] font-black text-gray-400 uppercase">Total Final</p>
                    <p id="txtTotal" class="text-4xl font-black text-gray-800">$ 0,00</p>
                </div>
                <button onclick="generarPDF()" class="bg-orange-600 hover:bg-orange-700 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-orange-200 transition-all transform active:scale-95">
                    Descargar PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        // Crear filas iniciales
        const container = document.getElementById('contenedor-items');
        for (let i = 1; i <= 6; i++) {
            const div = document.createElement('div');
            div.className = "flex gap-2";
            div.innerHTML = `
                <textarea placeholder="Descripción de la tarea ${i}..." class="item-desc flex-1 border-2 border-gray-50 p-2 rounded-xl text-sm outline-none focus:border-orange-300 resize-none" rows="1"></textarea>
                <input type="number" oninput="calcularTotal()" placeholder="$" class="item-val w-24 border-2 border-gray-50 p-2 rounded-xl text-right font-mono text-sm outline-none focus:border-orange-300">
            `;
            container.appendChild(div);
        }

        function toggleMateriales() {
            const expandir = document.getElementById('incMat').value === "SI";
            document.getElementById('seccionMat').classList.toggle('hidden', !expandir);
            if(!expandir) document.getElementById('valMat').value = "";
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('.item-val').forEach(input => total += parseFloat(input.value) || 0);
            if(document.getElementById('incMat').value === "SI") {
                total += parseFloat(document.getElementById('valMat').value) || 0;
            }
            document.getElementById('txtTotal').innerText = "$ " + total.toLocaleString('es-AR', {minimumFractionDigits: 2});
            return total;
        }

        function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const marginX = 20;
            let currentY = 20;

            // --- Estética del PDF ---
            doc.setFillColor(255, 120, 0);
            doc.rect(0, 0, 210, 40, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold").setFontSize(24);
            doc.text("MHE FULL SERVICES", marginX, 25);
            doc.setFontSize(10).setFont("helvetica", "normal");
            doc.text("CALIDAD Y SOLUCIONES INTEGRALES", marginX, 32);

            // Datos Cliente
            currentY = 55;
            doc.setTextColor(40, 40, 40);
            doc.setFontSize(10).setFont("helvetica", "bold");
            doc.text("PRESUPUESTO PARA:", marginX, currentY);
            
            doc.setFont("helvetica", "normal");
            currentY += 7;
            doc.text(`Cliente: ${document.getElementById('cliente').value || '---'}`, marginX, currentY);
            doc.text(`Fecha: ${document.getElementById('fecha').value || '---'}`, 140, currentY);
            currentY += 6;
            doc.text(`Actividad: ${document.getElementById('actividad').value}`, marginX, currentY);
            doc.text(`Presupuesto Nº: ${document.getElementById('presupuestoNo').value || '0001'}`, 140, currentY);

            // Tabla de Tareas
            currentY += 15;
            doc.setFillColor(240, 240, 240);
            doc.rect(marginX, currentY, 170, 8, 'F');
            doc.setFont("helvetica", "bold");
            doc.text("DESCRIPCIÓN DEL TRABAJO", marginX + 5, currentY + 5.5);
            doc.text("SUBTOTAL", 185, currentY + 5.5, {align: 'right'});

            currentY += 15;
            doc.setFont("helvetica", "normal").setFontSize(10);

            const descs = document.querySelectorAll('.item-desc');
            const vals = document.querySelectorAll('.item-val');

            descs.forEach((el, i) => {
                const texto = el.value.trim();
                const valor = parseFloat(vals[i].value) || 0;

                if (texto || valor > 0) {
                    // splitTextToSize hace la magia: rompe el texto si es muy largo
                    const lineas = doc.splitTextToSize(texto || "Servicio técnico", 120);
                    
                    // Imprimimos el valor alineado a la primera línea del texto
                    doc.text("$ " + valor.toLocaleString('es-AR'), 185, currentY, {align: 'right'});
                    
                    // Imprimimos las líneas de la descripción
                    doc.text(lineas, marginX + 5, currentY);
                    
                    // Calculamos cuánto espacio ocupó el texto para saltar el renglón
                    currentY += (lineas.length * 5) + 4;
                }
            });

            // Materiales
            if(document.getElementById('incMat').value === "SI") {
                const matTexto = document.getElementById('descMat').value || "Materiales varios";
                const matVal = parseFloat(document.getElementById('valMat').value) || 0;
                
                doc.setFont("helvetica", "bold").text("MATERIALES INCLUIDOS", marginX + 5, currentY);
                currentY += 6;
                doc.setFont("helvetica", "normal");
                const lineasMat = doc.splitTextToSize(matTexto, 120);
                doc.text(lineasMat, marginX + 5, currentY);
                doc.text("$ " + matVal.toLocaleString('es-AR'), 185, currentY, {align: 'right'});
                currentY += (lineasMat.length * 5) + 10;
            }

            // Total
            currentY = Math.max(currentY, 150);
            doc.setDrawColor(200).line(marginX, currentY, 190, currentY);
            currentY += 10;
            doc.setFontSize(14).setFont("helvetica", "bold");
            doc.text("TOTAL ESTIMADO:", marginX, currentY);
            doc.setTextColor(255, 100, 0);
            doc.text("$ " + calcularTotal().toLocaleString('es-AR', {minimumFractionDigits: 2}), 185, currentY, {align: 'right'});

            // Footer
            doc.setTextColor(150).setFontSize(8).setFont("helvetica", "italic");
            doc.text("* Validez: 10 días. Garantía de servicio: 3 meses.", marginX, currentY + 20);

            doc.save(`MHE_Presupuesto_${document.getElementById('presupuestoNo').value}.pdf`);
        }
    </script>
</body>
</html>
