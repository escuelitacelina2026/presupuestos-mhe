<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos y Recibos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center mb-6">MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="fecha" class="border p-2 rounded w-full outline-none">
                <input type="text" id="presupuestoNo" placeholder="Presupuesto Nº" class="border p-2 rounded w-full outline-none">
            </div>

            <input type="text" id="cliente" placeholder="Nombre del Cliente" class="border p-2 rounded w-full outline-none">
            
            <select id="actividad" class="border p-2 rounded w-full outline-none bg-white font-semibold">
                <option value="Electricidad">Electricidad</option>
                <option value="HVAC">HVAC (Air Conditioning)</option>
                <option value="Construcción en seco">Construcción en seco</option>
            </select>
            
            <div class="border-t pt-4">
                <p class="font-bold mb-2">Tareas a realizar:</p>
                <div class="space-y-2">
                    <div class="flex gap-2"><textarea id="d1" placeholder="Tarea 1" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea><input type="number" id="v1" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10"></div>
                    <div class="flex gap-2"><textarea id="d2" placeholder="Tarea 2" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea><input type="number" id="v2" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10"></div>
                    <div class="flex gap-2"><textarea id="d3" placeholder="Tarea 3" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea><input type="number" id="v3" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10"></div>
                    <div class="flex gap-2"><textarea id="d4" placeholder="Tarea 4" class="flex-1 border p-2 rounded text-sm outline-none resize-none" rows="1"></textarea><input type="number" id="v4" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor h-10"></div>
                </div>
            </div>

            <div class="bg-orange-50 p-4 rounded border border-orange-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold">¿Incluye Materiales?</label>
                    <select id="incMat" onchange="verMat()" class="border p-1 rounded bg-white font-bold">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="cajaMat" class="hidden space-y-2 pt-2 border-t border-orange-200">
                    <textarea id="descMat" placeholder="Descripción de materiales" class="w-full border p-2 rounded text-sm bg-white outline-none resize-none" rows="2"></textarea>
                    <input type="number" id="valMat" oninput="calcularTotal()" placeholder="$ Valor Materiales" class="w-full border p-2 rounded text-sm text-right bg-white outline-none">
                </div>
            </div>

            <div class="text-right p-4 bg-orange-100 rounded border border-orange-300">
                <span class="font-bold text-gray-700">TOTAL PRESUPUESTO: </span>
                <span id="txtTotal" class="text-2xl font-bold text-orange-600">$ 0,00</span>
            </div>

            <button onclick="prepararPDF('presupuesto')" class="w-full bg-gray-800 text-white py-3 rounded-xl font-bold hover:bg-black transition-all">
                📥 DESCARGAR PRESUPUESTO
            </button>

            <hr class="my-6 border-2 border-dashed border-orange-200">
            
            <div class="bg-white border-2 border-orange-500 p-4 rounded-xl shadow-inner">
                <h3 class="font-bold text-orange-600 mb-3 text-center underline">GESTIÓN DE RECIBO Y COBRO</h3>
                
                <label class="block text-sm font-bold mb-1">Estado:</label>
                <select id="estadoPresupuesto" onchange="mostrarOpcionesPago()" class="w-full border p-2 rounded mb-4 bg-orange-50">
                    <option value="pendiente">Pendiente de Aceptación</option>
                    <option value="aceptado">Aceptado / Generar Recibo</option>
                </select>

                <div id="seccionPago" class="hidden space-y-4 animate-pulse">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold uppercase text-gray-500">Abonado Ahora:</label>
                            <input type="number" id="montoAbonado" oninput="calcularSaldo()" placeholder="Ej: 5000" class="w-full border-2 border-green-500 p-2 rounded font-bold text-green-700">
                        </div>
                        <div>
                            <label class="text-xs font-bold uppercase text-gray-500">Saldo Restante:</label>
                            <div id="txtSaldo" class="p-2 bg-gray-100 rounded font-bold text-red-600 text-lg">$ 0,00</div>
                        </div>
                    </div>
                    
                    <button onclick="prepararPDF('recibo')" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition-all flex justify-center items-center gap-2">
                        <span>📄 GENERAR RECIBO DE PAGO</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let totalGlobal = 0;

        function verMat() {
            const si = document.getElementById('incMat').value === "SI";
            document.getElementById('cajaMat').classList.toggle('hidden', !si);
            calcularTotal();
        }

        function calcularTotal() {
            let t = 0;
            document.querySelectorAll('.item-valor').forEach(i => { t += parseFloat(i.value) || 0; });
            if(document.getElementById('incMat').value === "SI") {
                t += parseFloat(document.getElementById('valMat').value) || 0;
            }
            totalGlobal = t;
            document.getElementById('txtTotal').innerText = "$ " + t.toLocaleString('es-AR', {minimumFractionDigits: 2});
            calcularSaldo();
        }

        function mostrarOpcionesPago() {
            const estado = document.getElementById('estadoPresupuesto').value;
            const seccion = document.getElementById('seccionPago');
            seccion.classList.toggle('hidden', estado !== 'aceptado');
            if(estado === 'aceptado') calcularSaldo();
        }

        function calcularSaldo() {
            const abonado = parseFloat(document.getElementById('montoAbonado').value) || 0;
            const saldo = totalGlobal - abonado;
            document.getElementById('txtSaldo').innerText = "$ " + saldo.toLocaleString('es-AR', {minimumFractionDigits: 2});
            return saldo;
        }

        function prepararPDF(tipo) {
            const img = new Image();
            img.src = 'mhe.png'; 
            img.onload = () => finalizarPDF(img, tipo);
            img.onerror = () => finalizarPDF(null, tipo);
            setTimeout(() => { if(!img.complete) finalizarPDF(null, tipo); }, 1000);
        }

        function finalizarPDF(imgLogo, tipo) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const fecha = document.getElementById('fecha').value;
            const cliente = document.getElementById('cliente').value;
            const nro = document.getElementById('presupuestoNo').value;
            const abonado = parseFloat(document.getElementById('montoAbonado').value) || 0;
            const saldo = totalGlobal - abonado;

            // Encabezado estético (Igual que el presupuesto)
            doc.setFillColor(tipo === 'presupuesto' ? 234 : 22, tipo === 'presupuesto' ? 88 : 163, tipo === 'presupuesto' ? 12 : 74); // Naranja o Verde
            doc.rect(0, 0, 210, 40, 'F');
            
            if(imgLogo && imgLogo.complete && imgLogo.naturalWidth !== 0) {
                doc.addImage(imgLogo, 'PNG', 10, 5, 30, 30);
            }

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.text("MHE FULL SERVICES", 50, 25);
            
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(10);
            doc.text("Fecha: " + fecha, 10, 50);
            doc.text((tipo === 'presupuesto' ? "Presupuesto Nº: " : "Recibo de Presupuesto Nº: ") + nro, 140, 50);
            doc.text("Cliente: " + cliente, 10, 60);

            if(tipo === 'presupuesto') {
                // ... (Lógica de presupuesto que ya tenías)
                doc.setFont("helvetica", "bold");
                doc.text("TOTAL ESTIMADO: " + document.getElementById('txtTotal').innerText, 110, 150);
                doc.save(`Presupuesto_${cliente}.pdf`);
            } else {
                // LÓGICA DE RECIBO
                doc.setFontSize(16);
                doc.setFont("helvetica", "bold");
                doc.text("RECIBO DE PAGO", 10, 80);
                
                doc.setFontSize(12);
                doc.setFont("helvetica", "normal");
                let textoRecibo = `He recibido de ${cliente} la cantidad de $ ${abonado.toLocaleString('es-AR')} por concepto de pago (o adelanto) de los trabajos detallados en el presupuesto Nº ${nro}.`;
                doc.text(textoRecibo, 10, 95, {maxWidth: 180});

                // Cuadro de Resumen de Cuenta
                doc.setDrawColor(200);
                doc.setFillColor(245, 245, 245);
                doc.rect(10, 120, 190, 40, 'FD');
                
                doc.setFont("helvetica", "bold");
                doc.text("RESUMEN DE CUENTA:", 15, 130);
                doc.setFont("helvetica", "normal");
                doc.text(`Total del Trabajo: $ ${totalGlobal.toLocaleString('es-AR')}`, 15, 140);
                doc.text(`Total Abonado a la fecha: $ ${abonado.toLocaleString('es-AR')}`, 15, 147);
                
                doc.setFontSize(14);
                doc.setTextColor(saldo > 0 ? 200 : 0, 0, 0); // Rojo si falta pagar
                doc.text(`SALDO RESTANTE: $ ${saldo.toLocaleString('es-AR')}`, 15, 156);

                // Firma
                doc.setTextColor(0);
                doc.line(130, 190, 190, 190);
                doc.setFontSize(10);
                doc.text("Firma MHE Full Services", 140, 195);

                doc.save(`Recibo_MHE_${cliente}.pdf`);
            }
        }
    </script>
</body>
</html>
