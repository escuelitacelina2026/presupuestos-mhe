<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">PRESUPUESTO - MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">📅 Fecha</label>
                    <input type="date" id="fecha" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">🔢 Presupuesto Nº</label>
                    <input type="text" id="presupuestoNo" placeholder="001" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700">👤 Cliente</label>
                <input type="text" id="cliente" placeholder="Nombre del cliente" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">🛠️ Actividad</label>
                <select id="actividad" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white outline-none">
                    <option value="Electricidad">Electricidad</option>
                    <option value="HVAC (Heating Ventilation, and Air Conditioning)">HVAC (Heating Ventilation, and Air Conditioning)</option>
                    <option value="Construcción en seco">Construcción en seco</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">📝 Tareas a realizar</label>
                <textarea id="tareas" rows="3" placeholder="Descripción detallada..." class="w-full border border-gray-300 p-2.5 rounded-lg outline-none"></textarea>
            </div>

            <div class="border-t pt-4">
                <h2 class="text-lg font-bold text-slate-700 mb-3">DETALLE DE COSTOS</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">🏗️ Materiales</label>
                        <input type="number" id="costoMateriales" oninput="calcularTotal()" placeholder="$" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none text-right">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">👷 Mano de Obra</label>
                        <input type="number" id="manoObra" oninput="calcularTotal()" placeholder="$" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none text-right">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">💰 Total del trabajo a realizar</label>
                    <div id="totalMostrado" class="w-full border border-gray-300 p-2.5 rounded-lg font-bold text-lg text-orange-600 bg-gray-50 text-right">
                        $ 0.00
                    </div>
                </div>
            </div>
            
            <button onclick="prepararPDF()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-4 rounded-xl font-bold shadow-md transition-all transform active:scale-95">
                📥 GENERAR Y DESCARGAR PDF
            </button>
        </div>
    </div>

    <script>
        function calcularTotal() {
            const materiales = parseFloat(document.getElementById('costoMateriales').value) || 0;
            const manoObra = parseFloat(document.getElementById('manoObra').value) || 0;
            const total = materiales + manoObra;
            
            document.getElementById('totalMostrado').innerText = `$ ${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            return total;
        }

        function prepararPDF() {
            const img = new Image();
            img.src = 'mhe.png'; 
            img.onload = () => generarPDF(img);
            img.onerror = () => generarPDF(null);
        }

        function generarPDF(imgData) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const v = {
                fecha: document.getElementById('fecha').value,
                num: document.getElementById('presupuestoNo').value,
                cliente: document.getElementById('cliente').value,
                actividad: document.getElementById('actividad').value,
                tareas: document.getElementById('tareas').value,
                costoMat: document.getElementById('costoMateriales').value || "0",
                manoObra: document.getElementById('manoObra').value || "0",
                total: calcularTotal()
            };

            if (imgData) doc.addImage(imgData, 'PNG', 160, 10, 35, 35);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PRESUPUESTO - MHE Full Services", 15, 25);
            
            doc.setDrawColor(255, 100, 0); 
            doc.setLineWidth(1);
            doc.line(15, 48, 195, 48);

            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            doc.text(`Fecha: ${v.fecha}`, 20, 60);
            doc.text(`Presupuesto Nº: ${v.num}`, 20, 70);
            doc.text(`Cliente: ${v.cliente}`, 20, 80);
            doc.text(`Actividad: ${v.actividad}`, 20, 90);

            doc.setFont("helvetica", "bold");
            doc.text("TAREAS A REALIZAR:", 20, 105);
            doc.setFont("helvetica", "normal");
            const tareasDiv = doc.splitTextToSize(v.tareas || "---", 170);
            doc.text(tareasDiv, 20, 112);

            let yPos = 130 + (tareasDiv.length * 7);

            doc.setFont("helvetica", "bold");
            doc.text("DETALLE DE COSTOS", 20, yPos);
            doc.line(20, yPos + 2, 190, yPos + 2);
            
            doc.setFont("helvetica", "normal");
            doc.text(`Materiales:`, 25, yPos + 10);
            doc.text(`$ ${parseFloat(v.costoMat).toLocaleString()}`, 190, yPos + 10, { align: 'right' });
            
            doc.text(`Mano de Obra:`, 25, yPos + 18);
            doc.text(`$ ${parseFloat(v.manoObra).toLocaleString()}`, 190, yPos + 18, { align: 'right' });

            yPos += 35;
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text(`TOTAL DEL TRABAJO A REALIZAR:`, 20, yPos);
            doc.text(`$ ${v.total.toLocaleString()}`, 190, yPos, { align: 'right' });

            doc.save(`Presupuesto_MHE_${v.num}.pdf`);
        }
    </script>
</body>
</html>
