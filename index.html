
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center mb-6">PRESUPUESTO - MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="fecha" class="border p-2 rounded w-full outline-none">
                <input type="text" id="presupuestoNo" placeholder="Presupuesto Nº" class="border p-2 rounded w-full outline-none">
            </div>

            <input type="text" id="cliente" placeholder="Nombre del Cliente" class="border p-2 rounded w-full outline-none">
            
            <select id="actividad" class="border p-2 rounded w-full outline-none bg-white font-semibold">
                <option value="Electricidad">Electricidad</option>
                <option value="HVAC (Heating Ventilation, and Air Conditioning)">HVAC</option>
                <option value="Construcción en seco">Construcción en seco</option>
            </select>
            
            <div class="border-t pt-4">
                <p class="font-bold mb-2">Tareas a realizar:</p>
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <input type="text" id="d1" placeholder="Tarea 1" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v1" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="d2" placeholder="Tarea 2" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v2" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="d3" placeholder="Tarea 3" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v3" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="d4" placeholder="Tarea 4" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v4" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="d5" placeholder="Tarea 5" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v5" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="d6" placeholder="Tarea 6" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v6" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                </div>
            </div>

            <div class="bg-orange-50 p-4 rounded border border-orange-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold">¿Incluye Materiales?</label>
                    <select id="incMat" onchange="verMat()" class="border p-1 rounded bg-white font-bold">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="cajaMat" class="hidden space-y-2 pt-2 border-t border-orange-200">
                    <input type="text" id="descMat" placeholder="Descripción de materiales" class="w-full border p-2 rounded text-sm bg-white outline-none">
                    <input type="number" id="valMat" oninput="calcularTotal()" placeholder="$ Valor Materiales" class="w-full border p-2 rounded text-sm text-right bg-white outline-none">
                </div>
            </div>

            <div class="text-right p-4 bg-orange-100 rounded border border-orange-300">
                <span class="font-bold text-gray-700">TOTAL ESTIMADO: </span>
                <span id="txtTotal" class="text-2xl font-bold text-orange-600">$ 0,00</span>
            </div>
            
            <button onclick="prepararPDF()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-orange-700 transition-all transform active:scale-95">
                📥 GENERAR Y DESCARGAR PDF
            </button>
        </div>
    </div>

    <script>
        function verMat() {
            const si = document.getElementById('incMat').value === "SI";
            document.getElementById('cajaMat').style.display = si ? 'block' : 'none';
            if(!si) { document.getElementById('valMat').value = ""; }
            calcularTotal();
        }

        function calcularTotal() {
            let t = 0;
            document.querySelectorAll('.item-valor').forEach(i => { t += parseFloat(i.value) || 0; });
            if(document.getElementById('incMat').value === "SI") {
                t += parseFloat(document.getElementById('valMat').value) || 0;
            }
            document.getElementById('txtTotal').innerText = "$ " + t.toLocaleString('es-AR', {minimumFractionDigits: 2});
            return t;
        }

        // Esta función carga la imagen primero y luego dispara el PDF
        function prepararPDF() {
            const img = new Image();
            img.src = 'mhe.png'; // Asegúrate de que el nombre sea exacto
            img.onload = function() { hacerPDF(img); };
            img.onerror = function() { hacerPDF(null); }; // Si no hay imagen, genera igual
        }

        function hacerPDF(logoImg) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const total = calcularTotal();
            const nro = document.getElementById('presupuestoNo').value || "001";

            // Si la imagen cargó, la ponemos
            if (logoImg) {
                doc.addImage(logoImg, 'PNG', 160, 10, 35, 35);
            }

            // Título Principal
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PRESUPUESTO - MHE Full Services", 15, 25);
            doc.setDrawColor(255, 100, 0);
            doc.setLineWidth(1);
            doc.line(15, 48, 195, 48);

            // Datos
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text("Fecha: " + (document.getElementById('fecha').value || "---"), 20, 60);
            doc.text("Presupuesto N: " + nro, 20, 68);
            doc.text("Cliente: " + (document.getElementById('cliente').value || "---"), 20, 76);
            doc.text("Actividad: " + document.getElementById('actividad').value, 20, 84);

            // Tareas
            doc.setFont("helvetica", "bold");
            doc.text("DETALLE DE TAREAS A REALIZAR:", 20, 95);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            
            let y = 102;
            for (let i = 1; i <= 6; i++) {
                let d = document.getElementById('d' + i).value;
                let v = document.getElementById('v' + i).value;
                if(d || v) {
                    doc.text(i + ". " + (d || "Servicio técnico"), 25, y);
                    doc.text("$ " + (parseFloat(v) || 0).toLocaleString('es-AR'), 185, y, {align: 'right'});
                    y += 7;
                }
            }

            // Materiales
            if(document.getElementById('incMat').value === "SI") {
                y += 5;
                doc.setFont("helvetica", "bold");
                doc.text("MATERIALES INCLUIDOS:", 20, y);
                doc.setFont("helvetica", "normal");
                y += 7;
                doc.text(document.getElementById('descMat').value || "Materiales varios", 25, y);
                doc.text("$ " + (parseFloat(document.getElementById('valMat').value) || 0).toLocaleString('es-AR'), 185, y, {align: 'right'});
                y += 10;
            }

            // Total
            y += 15;
            doc.setDrawColor(200);
            doc.line(20, y, 190, y);
            y += 10;
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("TOTAL DEL TRABAJO:", 20, y);
            doc.text("$ " + total.toLocaleString('es-AR', {minimumFractionDigits: 2}), 185, y, {align: 'right'});

            // LEYENDAS (Vigencia y Garantía)
            y += 25;
            doc.setFontSize(9);
            doc.text("* Este presupuesto tiene una vigencia de 10 dias.", 20, y);
            y += 7;
            doc.text("* Se garantiza la calidad del servicio prestado por un periodo de 3 meses bajo", 20, y);
            y += 5;
            doc.text("  condiciones normales de uso.", 20, y);

            // Guardar
            doc.save("Presupuesto_MHE_" + nro + ".pdf");
        }
    </script>
</body>
</html>
