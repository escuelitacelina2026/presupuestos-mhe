<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">PRESUPUESTO - MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">📅 Fecha</label>
                    <input type="date" id="fecha" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">🔢 Presupuesto Nº</label>
                    <input type="text" id="presupuestoNo" placeholder="001" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700">👤 Cliente</label>
                <input type="text" id="cliente" placeholder="Nombre del cliente" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">🛠️ Actividad</label>
                <select id="actividad" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white outline-none">
                    <option value="Electricidad">Electricidad</option>
                    <option value="HVAC (Heating Ventilation, and Air Conditioning)">HVAC (Heating Ventilation, and Air Conditioning)</option>
                    <option value="Construcción en seco">Construcción en seco</option>
                </select>
            </div>
            
            <div class="border-t pt-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">📝 Tareas a realizar</label>
                <div id="lista-tareas" class="space-y-2">
                    </div>
            </div>

            <div class="border-t pt-4 bg-orange-50 p-4 rounded-lg">
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-bold text-gray-700">🏗️ ¿Materiales incluidos?</label>
                    <select id="incluyeMateriales" onchange="toggleMateriales()" class="border border-gray-300 p-1 rounded-lg outline-none">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="detalle-materiales" class="hidden space-y-2">
                    <input type="text" id="descMateriales" placeholder="Descripción de materiales incluidos..." class="w-full border border-gray-300 p-2.5 rounded-lg outline-none">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-gray-600">Valor Materiales: $</span>
                        <input type="number" id="costoMateriales" oninput="calcularTotal()" placeholder="0" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none text-right">
                    </div>
                </div>
            </div>

            <div class="border-t pt-4">
                <label class="block text-sm font-bold text-gray-700">💰 Total del trabajo a realizar</label>
                <div id="totalMostrado" class="w-full border border-gray-300 p-2.5 rounded-lg font-bold text-lg text-orange-600 bg-gray-50 text-right">
                    $ 0.00
                </div>
            </div>
            
            <button onclick="prepararPDF()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-4 rounded-xl font-bold shadow-md transition-all transform active:scale-95">
                📥 GENERAR Y DESCARGAR PDF
            </button>
        </div>
    </div>

    <script>
        // Generar los 6 inputs de tareas al cargar
        const listaTareas = document.getElementById('lista-tareas');
        for (let i = 1; i <= 6; i++) {
            listaTareas.innerHTML += `
                <div class="flex gap-2 items-center">
                    <span class="text-xs font-bold text-gray-400 w-12">Item ${i}</span>
                    <input type="text" id="tareaDesc${i}" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none">
                    <input type="number" id="tareaVal${i}" oninput="calcularTotal()" placeholder="$ Valor" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right outline-none valor-tarea">
                </div>
            `;
        }

        function toggleMateriales() {
            const incluye = document.getElementById('incluyeMateriales').value;
            const divDetalle = document.getElementById('detalle-materiales');
            const costoMat = document.getElementById('costoMateriales');
            
            if (incluye === "SI") {
                divDetalle.classList.remove('hidden');
            } else {
                divDetalle.classList.add('hidden');
                costoMat.value = ""; // Limpiar valor si se oculta
                calcularTotal();
            }
        }

        function calcularTotal() {
            let total = 0;
            
            // Sumar tareas
            document.querySelectorAll('.valor-tarea').forEach(input => {
                total += parseFloat(input.value) || 0;
            });

            // Sumar materiales si aplica
            const costoMat = parseFloat(document.getElementById('costoMateriales').value) || 0;
            total += costoMat;
            
            document.getElementById('totalMostrado').innerText = `$ ${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            return total;
        }

        function prepararPDF() {
            const img = new Image();
            img.src = 'mhe.png'; 
            img.onload = () => generarPDF(img);
            img.onerror = () => generarPDF(null);
        }

        function generarPDF(imgData) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const total = calcularTotal();
            const numPres = document.getElementById('presupuestoNo').value;

            if (imgData) doc.addImage(imgData, 'PNG', 160, 10, 35, 35);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PRESUPUESTO - MHE Full Services", 15, 25);
            
            doc.setDrawColor(255, 100, 0); 
            doc.setLineWidth(1);
            doc.line(15, 48, 195, 48);

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text(`Fecha: ${document.getElementById('fecha').value}`, 20, 58);
            doc.text(`Presupuesto Nº: ${numPres}`, 20, 65);
            doc.text(`Cliente: ${document.getElementById('cliente').value}`, 20, 72);
            doc.text(`Actividad: ${document.getElementById('actividad').value}`, 20, 79);

            doc.setFont("helvetica", "bold");
            doc.text("DETALLE DE TAREAS:", 20, 90);
            
            let yPos = 97;
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            
            //
