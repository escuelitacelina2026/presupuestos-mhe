<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 p-4">

    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">PRESUPUESTO - MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">📅 Fecha</label>
                    <input type="date" id="fecha" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">🔢 Presupuesto Nº</label>
                    <input type="text" id="presupuestoNo" placeholder="001" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700">👤 Cliente</label>
                <input type="text" id="cliente" placeholder="Nombre del cliente" class="w-full border border-gray-300 p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700">🛠️ Actividad</label>
                <select id="actividad" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white outline-none">
                    <option value="Electricidad">Electricidad</option>
                    <option value="HVAC (Heating Ventilation, and Air Conditioning)">HVAC (Heating Ventilation, and Air Conditioning)</option>
                    <option value="Construcción en seco">Construcción en seco</option>
                </select>
            </div>
            
            <div class="border-t pt-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">📝 Tareas a realizar</label>
                <div class="space-y-2">
                    <div class="flex gap-2 items-center"><span class="text-xs font-bold text-gray-400 w-10">Item 1</span><input type="text" id="tareaDesc1" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none"><input type="number" id="tareaVal1" oninput="calcularTotal()" placeholder="$" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right valor-tarea"></div>
                    <div class="flex gap-2 items-center"><span class="text-xs font-bold text-gray-400 w-10">Item 2</span><input type="text" id="tareaDesc2" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none"><input type="number" id="tareaVal2" oninput="calcularTotal()" placeholder="$" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right valor-tarea"></div>
                    <div class="flex gap-2 items-center"><span class="text-xs font-bold text-gray-400 w-10">Item 3</span><input type="text" id="tareaDesc3" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none"><input type="number" id="tareaVal3" oninput="calcularTotal()" placeholder="$" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right valor-tarea"></div>
                    <div class="flex gap-2 items-center"><span class="text-xs font-bold text-gray-400 w-10">Item 4</span><input type="text" id="tareaDesc4" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none"><input type="number" id="tareaVal4" oninput="calcularTotal()" placeholder="$" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right valor-tarea"></div>
                    <div class="flex gap-2 items-center"><span class="text-xs font-bold text-gray-400 w-10">Item 5</span><input type="text" id="tareaDesc5" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none"><input type="number" id="tareaVal5" oninput="calcularTotal()" placeholder="$" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right valor-tarea"></div>
                    <div class="flex gap-2 items-center"><span class="text-xs font-bold text-gray-400 w-10">Item 6</span><input type="text" id="tareaDesc6" placeholder="Descripción" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none"><input type="number" id="tareaVal6" oninput="calcularTotal()" placeholder="$" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right valor-tarea"></div>
                </div>
            </div>

            <div class="border-t pt-4 bg-orange-50 p-4 rounded-lg border border-orange-200">
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-bold text-gray-700">🏗️ Materiales incluidos</label>
                    <select id="incluyeMateriales" onchange="toggleMateriales()" class="border border-gray-300 p-1.5 rounded-lg bg-white font-bold cursor-pointer">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="detalle-materiales" style="display: none;" class="space-y-2 mt-2">
                    <div class="flex gap-2 items-center">
                        <input type="text" id="descMateriales" placeholder="Descripción de materiales" class="flex-1 border border-gray-300 p-2 rounded-lg text-sm outline-none bg-white">
                        <input type="number" id="costoMateriales" oninput="calcularTotal()" placeholder="$ Valor" class="w-24 border border-gray-300 p-2 rounded-lg text-sm text-right bg-white">
                    </div>
                </div>
            </div>

            <div class="border-t pt-4">
                <label class="block text-sm font-bold text-gray-700">💰 Total del trabajo a realizar</label>
                <div id="totalMostrado" class="w-full border border-gray-300 p-3 rounded-lg font-bold text-2xl text-orange-600 bg-white text-right">
                    $ 0,00
                </div>
            </div>
            
            <button onclick="generarPDF()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-4 rounded-xl font-bold shadow-md transition-all transform active:scale-95">
                📥 GENERAR Y DESCARGAR PDF
            </button>
        </div>
    </div>

    <script>
        function toggleMateriales() {
            const incluye = document.getElementById('incluyeMateriales').value;
            const divDetalle = document.getElementById('detalle-materiales');
            const inputValor = document.getElementById('costoMateriales');
            divDetalle.style.display = (incluye === "SI") ? 'block' : 'none';
            if (incluye === "NO") { inputValor.value = ""; calcularTotal(); }
        }

        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('.valor-tarea').forEach(t => { total += parseFloat(t.value) || 0; });
            if (document.getElementById('incluyeMateriales').value === "SI") {
                total += parseFloat(document.getElementById('costoMateriales').value) || 0;
            }
            document.getElementById('totalMostrado').innerText = `$ ${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
            return total;
        }

        async function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const total = calcularTotal();
            const num = document.getElementById('presupuestoNo').value || "001";

            // Intentar cargar logo (op
