<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHE FULL SERVICES - Presupuestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg border-t-8 border-orange-500">
        <h1 class="text-2xl font-bold text-center mb-6">PRESUPUESTO - MHE Full Services</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="fecha" class="border p-2 rounded w-full outline-none">
                <input type="text" id="presupuestoNo" placeholder="Presupuesto Nº" class="border p-2 rounded w-full outline-none">
            </div>

            <input type="text" id="cliente" placeholder="Nombre del Cliente" class="border p-2 rounded w-full outline-none">
            
            <select id="actividad" class="border p-2 rounded w-full outline-none bg-white">
                <option value="Electricidad">Electricidad</option>
                <option value="HVAC (Calefacción y Aire)">HVAC</option>
                <option value="Construcción en seco">Construcción en seco</option>
            </select>
            
            <div class="border-t pt-4">
                <p class="font-bold mb-2">Tareas:</p>
                <div id="lista">
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="d1" placeholder="Tarea 1" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v1" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="d2" placeholder="Tarea 2" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v2" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="d3" placeholder="Tarea 3" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v3" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="d4" placeholder="Tarea 4" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v4" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="d5" placeholder="Tarea 5" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v5" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="d6" placeholder="Tarea 6" class="flex-1 border p-2 rounded text-sm outline-none">
                        <input type="number" id="v6" oninput="calcularTotal()" placeholder="$" class="w-24 border p-2 rounded text-sm text-right item-valor">
                    </div>
                </div>
            </div>

            <div class="bg-orange-50 p-4 rounded border border-orange-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold">¿Incluye Materiales?</label>
                    <select id="incMat" onchange="verMat()" class="border p-1 rounded bg-white">
                        <option value="NO">NO</option>
                        <option value="SI">SI</option>
                    </select>
                </div>
                <div id="cajaMat" class="hidden space-y-2">
                    <input type="text" id="descMat" placeholder="¿Qué materiales?" class="w-full border p-2 rounded text-sm outline-none bg-white">
                    <input type="number" id="valMat" oninput="calcularTotal()" placeholder="Costo materiales" class="w-full border p-2 rounded text-sm text-right outline-none bg-white">
                </div>
            </div>

            <div class="text-right p-4 bg-gray-50 rounded border">
                <span class="font-bold text-gray-600">TOTAL: </span>
                <span id="txtTotal" class="text-2xl font-bold text-orange-600">$ 0,00</span>
            </div>
            
            <button onclick="hacerPDF()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold hover:bg-orange-700">
                GENERAR PDF
            </button>
        </div>
    </div>

    <script>
        function verMat() {
            const si = document.getElementById('incMat').value === "SI";
            document.getElementById('cajaMat').style.display = si ? 'block' : 'none';
            if(!si) { document.getElementById('valMat').value = ""; }
            calcularTotal();
        }

        function calcularTotal() {
            let t = 0;
            document.querySelectorAll('.item-valor').forEach(i => { t += parseFloat(i.value) || 0; });
            if(document.getElementById('incMat').value === "SI") {
                t += parseFloat(document.getElementById('valMat').value) || 0;
            }
            document.getElementById('txtTotal').innerText = "$ " + t.toLocaleString('es-AR', {minimumFractionDigits: 2});
            return t;
        }

        function hacerPDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const total = calcularTotal();
                const nro = document.getElementById('presupuestoNo').value || "001";

                // Título
                doc.setFontSize(18);
                doc.text("PRESUPUESTO - MHE Full Services", 15, 20);
                doc.line(15, 25, 195, 25);

                // Datos
                doc.setFontSize(11);
                doc.text("Fecha: " + document.getElementById('fecha').value, 20, 40);
                doc.text("Presupuesto N: " + nro, 20, 47);
                doc.text("Cliente: " + document.getElementById('cliente').value, 20, 54);
                doc.text("Actividad: " + document.getElementById('actividad').value, 20, 61);

                // Tareas
                doc.setFont("helvetica", "bold");
                doc.text("DETALLE DE TAREAS:", 20, 75);
                doc.setFont("helvetica", "normal");
                
                let y = 82;
                for (let i = 1; i <= 6; i++) {
                    let d = document.getElementById('d' + i).value;
                    let v = document.getElementById('v' + i).value;
                    if(d || v) {
                        doc.text(i + ". " + (d || "Servicio"), 25, y);
                        doc.text("$ " + (parseFloat(v) || 0).toLocaleString(), 180, y, {align: 'right'});
                        y += 7;
                    }
                }

                // Materiales en PDF
                if(document.getElementById('incMat').value === "SI") {
                    y += 5;
                    doc.setFont("helvetica", "bold");
                    doc.text("MATERIALES INCLUIDOS:", 20, y);
                    doc.setFont("helvetica", "normal");
                    y += 7;
                    doc.text(document.getElementById('descMat').value || "Varios", 25, y);
                    doc.text("$ " + (parseFloat(document.getElementById('valMat').value) || 0).toLocaleString(), 180, y, {align: 'right'});
                    y += 10;
                }

                // Total Final
                y += 10;
                doc.setFontSize(14);
                doc.text("TOTAL: $ " + total.toLocaleString(), 180, y, {align: 'right'});

                // LEYENDAS (Puestas con texto directo para evitar fallos)
                y += 20;
                doc.setFontSize(9);
                doc.text("* Este presupuesto tiene una vigencia de 10 dias.", 20, y);
                y += 7;
                doc.text("* Se garantiza la calidad del servicio por 3 meses.", 20, y);

                doc.save("Presupuesto_" + nro + ".pdf");
            } catch (error) {
                alert("Error al generar: " + error.message);
            }
        }
    </script>
</body>
</html>
